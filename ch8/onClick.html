<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/memo.css">
    <title>onclick 이벤트 예제</title>
</head>
<body>
    <h1>onclick 이벤트</h1>
    <input type="number" id="num1" value="5"> + 
    <input type="number" id="num2" value="6">
    <button onclick="runAdd()">계산 실행</button>

    <p id="first"></p>

    <script>
        function jsFunction(a1, a2) {
            return a1 + a2;
        }

        function runAdd() {
            var n1 = Number(document.getElementById("num1").value);
            var n2 = Number(document.getElementById("num2").value);
            var result = jsFunction(n1, n2);
            document.getElementById("first").innerHTML = "결과: " + result;
        }
    </script>
    <memo-bar id="memo-bar"><span class="mb-app">📝 메모장</span><span class="mb-file">onClick.html</span><span class="mb-info">UTF-8</span><a class="mb-back" href="../chap8javascript.html">← 8장 목록</a></memo-bar>
</body>
</html>
