<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/memo.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예제 3-9 표 크기와 구역</title>
</head>
<body>
    <h2>width와 height로 크기 지정</h2>
    <table border="1" width="100%">
        <thead>
            <tr><th width="30%">상품</th><th width="20%">수량</th><th>금액</th></tr>
        </thead>
        <tbody>
            <tr height="40"><td>노트</td><td>3</td><td>4,500원</td></tr>
            <tr height="40"><td>연필</td><td>10</td><td>5,000원</td></tr>
        </tbody>
        <tfoot>
            <tr><th colspan="2">합계</th><th>9,500원</th></tr>
        </tfoot>
    </table>
    <ul>
        <li><b>thead</b> : 표의 머리글 구역</li>
        <li><b>tbody</b> : 표의 본문 구역</li>
        <li><b>tfoot</b> : 표의 바닥글 구역 (합계 등)</li>
        <li>width는 픽셀(300) 또는 퍼센트(50%)로 지정합니다. 요즘은 CSS로 크기를 지정하는 방법을 더 많이 씁니다.</li>
    </ul>
    <memo-bar id="memo-bar"><span class="mb-app">📝 메모장</span><span class="mb-file">ex3-9-tableSize.html</span><span class="mb-info">UTF-8</span><a class="mb-back" href="../chap3html.html">← 3장 목록</a></memo-bar>
</body>
</html>
