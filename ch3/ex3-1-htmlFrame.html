<!DOCTYPE html>
<!-- 1. 문서 형식 선언: 이 문서가 HTML5 문서임을 알린다 -->
<html lang="ko">
<!-- 2. html: 문서 전체를 감싸는 최상위 요소, lang으로 언어 지정 -->
<head>
    <!-- 3. head: 화면에 보이지 않는 문서 정보 -->
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/memo.css">
    <title>예제 3-1 HTML 문서 구조</title>
</head>
<body>
    <!-- 4. body: 브라우저 화면에 실제로 보이는 내용 -->
    <h1>나의 첫 번째 웹 페이지</h1>
    <p>HTML 문서는 <b>head</b>와 <b>body</b> 두 부분으로 나뉩니다.</p>
    <p>브라우저 탭에 보이는 글자는 head 안의 title 태그 내용입니다.</p>
    <memo-bar id="memo-bar"><span class="mb-app">📝 메모장</span><span class="mb-file">ex3-1-htmlFrame.html</span><span class="mb-info">UTF-8</span><a class="mb-back" href="../chap3html.html">← 3장 목록</a></memo-bar>
</body>
</html>
