<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/memo.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예제 3-7 기본 표</title>
</head>
<body>
    <table border="1">
        <caption>우리 반 시간표</caption>
        <tr>
            <th>교시</th><th>월</th><th>화</th><th>수</th>
        </tr>
        <tr>
            <th>1</th><td>국어</td><td>수학</td><td>영어</td>
        </tr>
        <tr>
            <th>2</th><td>과학</td><td>국어</td><td>체육</td>
        </tr>
        <tr>
            <th>3</th><td>음악</td><td>영어</td><td>수학</td>
        </tr>
    </table>
    <ul>
        <li><b>table</b> : 표 전체</li>
        <li><b>caption</b> : 표 제목</li>
        <li><b>tr</b> : 행 (table row)</li>
        <li><b>th</b> : 제목 셀 (굵게, 가운데 정렬)</li>
        <li><b>td</b> : 일반 셀 (table data)</li>
    </ul>
    <memo-bar id="memo-bar"><span class="mb-app">📝 메모장</span><span class="mb-file">ex3-7-table.html</span><span class="mb-info">UTF-8</span><a class="mb-back" href="../chap3html.html">← 3장 목록</a></memo-bar>
</body>
</html>
