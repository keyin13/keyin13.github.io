<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 한글이 깨지지 않도록 문자 인코딩 지정 -->
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/memo.css">
    <!-- 모바일 화면 폭에 맞게 보이도록 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 검색 엔진에 보여줄 문서 정보 -->
    <meta name="description" content="meta 태그 사용법을 알아보는 예제입니다.">
    <meta name="keywords" content="HTML, meta, charset, viewport">
    <meta name="author" content="홍길동">
    <title>예제 3-2 meta 태그</title>
</head>
<body>
    <h1>meta 태그</h1>
    <p>meta 태그는 화면에 보이지 않지만 문서에 대한 정보를 브라우저와 검색 엔진에 알려줍니다.</p>
    <ul>
        <li><b>charset</b> : 문자 인코딩 (UTF-8 권장)</li>
        <li><b>viewport</b> : 모바일 화면 크기 설정</li>
        <li><b>description</b> : 페이지 설명</li>
        <li><b>keywords</b> : 검색 키워드</li>
        <li><b>author</b> : 작성자</li>
    </ul>
    <p>브라우저에서 <b>Ctrl + U</b>를 눌러 소스를 확인해 보세요.</p>
    <memo-bar id="memo-bar"><span class="mb-app">📝 메모장</span><span class="mb-file">ex3-2-meta.html</span><span class="mb-info">UTF-8</span><a class="mb-back" href="../chap3html.html">← 3장 목록</a></memo-bar>
</body>
</html>
