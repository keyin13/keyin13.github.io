<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/memo.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예제 5-10 색상 표현</title>
    <style>
        .chip { padding: 12px; margin: 6px 0; color: white; font-weight: bold; }
        .name { background-color: tomato; }
        .hex { background-color: #3498db; }
        .hex3 { background-color: #f90; }
        .rgb { background-color: rgb(46, 204, 113); }
        .rgba { background-color: rgba(46, 204, 113, 0.4); color: #333; }
        .hsl { background-color: hsl(280, 60%, 50%); }
        .grad { background: linear-gradient(to right, #ff7e5f, #feb47b); }
        .radial { background: radial-gradient(circle, #fff176, #f57f17); color: #333; }
        .bg-wrap { background: url(../images/sample.svg) center / cover; padding: 20px; }
    </style>
</head>
<body>
    <h2>색상을 지정하는 방법</h2>
    <div class="chip name">색 이름 : tomato</div>
    <div class="chip hex">16진수 : #3498db</div>
    <div class="chip hex3">16진수 3자리 : #f90 (= #ff9900)</div>
    <div class="chip rgb">rgb(46, 204, 113)</div>
    <div class="chip rgba">rgba(46, 204, 113, 0.4) : 마지막 값은 투명도 0 ~ 1</div>
    <div class="chip hsl">hsl(280, 60%, 50%) : 색상, 채도, 명도</div>

    <h2>그라데이션과 배경 이미지</h2>
    <div class="chip grad">linear-gradient</div>
    <div class="chip radial">radial-gradient</div>
    <div class="bg-wrap">
        <div class="chip rgba">배경 이미지 위에 반투명 상자</div>
    </div>
    <memo-bar id="memo-bar"><span class="mb-app">📝 메모장</span><span class="mb-file">ex5-10-color.html</span><span class="mb-info">UTF-8</span><a class="mb-back" href="../chap5CSS.html">← 5장 목록</a></memo-bar>
</body>
</html>
