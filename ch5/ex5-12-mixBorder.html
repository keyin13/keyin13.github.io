<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/memo.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예제 5-12 혼합 경계선</title>
    <style>
        div { padding: 16px; margin: 16px 0; background: #fafafa; }
        /* 값 4개 : 위 오른쪽 아래 왼쪽 (시계 방향) */
        .mix { border-style: solid dashed dotted double; border-width: 4px; border-color: red green blue orange; }
        /* 한 변만 */
        .left { border-left: 6px solid #3498db; background: #eaf4fc; }
        .bottom { border-bottom: 2px dashed #999; background: none; }
        /* 둥근 모서리 */
        .round { border: 2px solid #8e44ad; border-radius: 12px; }
        .pill { border: 2px solid #16a085; border-radius: 999px; text-align: center; }
        .circle { width: 100px; height: 100px; padding: 0; border: 4px solid #e67e22;
                  border-radius: 50%; line-height: 100px; text-align: center; }
        .corner { border: 2px solid #c0392b; border-radius: 30px 0 30px 0; }
        /* 테두리 대신 외곽선 : 공간을 차지하지 않는다 */
        .outline { border: 1px solid #333; outline: 4px dotted gold; outline-offset: 6px; }
    </style>
</head>
<body>
    <div class="mix">위:빨강 실선 / 오른쪽:초록 파선 / 아래:파랑 점선 / 왼쪽:주황 이중선</div>
    <div class="left">border-left만 : 인용·알림 상자로 자주 사용</div>
    <div class="bottom">border-bottom만 : 밑줄 구분선</div>
    <div class="round">border-radius: 12px</div>
    <div class="pill">border-radius: 999px (알약 모양)</div>
    <div class="circle">원</div>
    <div class="corner">border-radius: 30px 0 30px 0</div>
    <div class="outline">outline과 outline-offset</div>
    <memo-bar id="memo-bar"><span class="mb-app">📝 메모장</span><span class="mb-file">ex5-12-mixBorder.html</span><span class="mb-info">UTF-8</span><a class="mb-back" href="../chap5CSS.html">← 5장 목록</a></memo-bar>
</body>
</html>
