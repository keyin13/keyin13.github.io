        body { background-color: #f0f8ff; }
        h1 { color: darkblue; text-align: center; }
        p { color: #444; font-size: 17px; }
    </style>
</head>

    <h1>내부 스타일시트</h1>
    <p>style 태그는 head 안에 작성하며 현재 문서에만 적용됩니다.</p>
