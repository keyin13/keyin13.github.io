<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/memo.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예제 5-6 클래스 선택자</title>
    <style>
        /* . + class 이름 : 여러 요소에 반복 사용 */
        .red { color: red; }
        .big { font-size: 28px; }
        .box { border: 1px solid #999; padding: 8px; margin: 6px 0; }

        /* 태그.클래스 : p 태그 중 red 클래스만 */
        p.red { background-color: #ffe5e5; }
    </style>
</head>
<body>
    <p class="red">class="red"</p>
    <h3 class="red">h3에도 같은 클래스를 쓸 수 있습니다 (배경 없음)</h3>
    <p class="big">class="big"</p>
    <p class="red big">class="red big" : 두 클래스 동시 적용</p>
    <div class="box">class="box"</div>
    <div class="box red">class="box red"</div>
    <memo-bar id="memo-bar"><span class="mb-app">📝 메모장</span><span class="mb-file">ex5-6-classSelector.html</span><span class="mb-info">UTF-8</span><a class="mb-back" href="../chap5CSS.html">← 5장 목록</a></memo-bar>
</body>
</html>
