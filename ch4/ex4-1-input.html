<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/memo.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예제 4-1 텍스트 입력</title>
</head>
<body>
    <h2>로그인</h2>
    <!-- action: 데이터를 보낼 주소, method: 보내는 방식(get / post) -->
    <form action="#" method="get">
        <p>
            <label for="userId">아이디</label>
            <input type="text" id="userId" name="userId" placeholder="아이디 입력" maxlength="12">
        </p>
        <p>
            <label for="userPw">비밀번호</label>
            <input type="password" id="userPw" name="userPw" placeholder="비밀번호 입력">
        </p>
        <p>
            <label for="nick">별명(수정 불가)</label>
            <input type="text" id="nick" name="nick" value="웹초보" readonly>
        </p>
        <p>
            <input type="submit" value="로그인">
            <input type="reset" value="다시 쓰기">
            <button type="button">일반 버튼</button>
        </p>
    </form>
    <p>로그인을 누르면 주소창 끝에 <code>?userId=...&amp;userPw=...</code> 형태로 값이 붙습니다(get 방식).</p>
    <memo-bar id="memo-bar"><span class="mb-app">📝 메모장</span><span class="mb-file">ex4-1-input.html</span><span class="mb-info">UTF-8</span><a class="mb-back" href="../chap4multi.html">← 4장 목록</a></memo-bar>
</body>
</html>
