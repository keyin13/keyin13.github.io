<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/memo.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예제 4-3 다양한 input 타입</title>
    <style>
        label { display: inline-block; width: 110px; }
        p { margin: 10px 0; }
    </style>
</head>
<body>
    <h2>HTML5 input 타입</h2>
    <form action="#">
        <p><label>email</label><input type="email" placeholder="a@b.com"></p>
        <p><label>url</label><input type="url" placeholder="https://"></p>
        <p><label>tel</label><input type="tel" placeholder="010-0000-0000"></p>
        <p><label>number</label><input type="number" min="1" max="10" step="1" value="5"></p>
        <p><label>range</label><input type="range" min="0" max="100" value="30"></p>
        <p><label>date</label><input type="date"></p>
        <p><label>time</label><input type="time"></p>
        <p><label>color</label><input type="color" value="#007bff"></p>
        <p><label>search</label><input type="search" placeholder="검색어"></p>
        <p><label>file</label><input type="file" accept="image/*"></p>
        <p><label>image 버튼</label><input type="image" src="../images/logo.svg" alt="전송" width="40"></p>
        <p><input type="hidden" name="secret" value="화면에 보이지 않는 값"></p>
    </form>
    <p>모바일에서 열면 email은 @ 키보드, tel은 숫자 키패드가 나타납니다.</p>
    <memo-bar id="memo-bar"><span class="mb-app">📝 메모장</span><span class="mb-file">ex4-3-inputTypes.html</span><span class="mb-info">UTF-8</span><a class="mb-back" href="../chap4multi.html">← 4장 목록</a></memo-bar>
</body>
</html>
