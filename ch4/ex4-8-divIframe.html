<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/memo.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예제 4-8 div와 iframe</title>
    <style>
        .box { border: 2px solid #3498db; padding: 10px; margin: 10px 0; }
        .menu { background: #ecf0f1; }
        span.hl { background: yellow; }
        iframe { width: 100%; height: 280px; border: 1px solid #aaa; }
    </style>
</head>
<body>
    <h2>div : 블록 영역 나누기</h2>
    <div class="box menu">
        <a href="ex4-1-input.html" target="view">4-1 입력</a> |
        <a href="ex4-2-radioCheck.html" target="view">4-2 라디오/체크</a> |
        <a href="ex4-9-list.html" target="view">4-9 목록</a>
    </div>

    <h2>span : 줄 안의 일부분</h2>
    <p>span은 줄을 바꾸지 않고 <span class="hl">일부 글자만</span> 묶을 때 씁니다.</p>

    <h2>iframe : 다른 문서를 안에 넣기</h2>
    <p>위 메뉴를 누르면 아래 iframe 안에서 페이지가 열립니다 (a의 target과 iframe의 name이 같음).</p>
    <iframe name="view" src="ex4-1-input.html" title="예제 보기"></iframe>

    <h2>지도 넣기</h2>
    <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=126.97%2C37.56%2C126.99%2C37.57&amp;layer=mapnik"
            title="서울 시청 주변 지도"></iframe>
    <memo-bar id="memo-bar"><span class="mb-app">📝 메모장</span><span class="mb-file">ex4-8-divIframe.html</span><span class="mb-info">UTF-8</span><a class="mb-back" href="../chap4multi.html">← 4장 목록</a></memo-bar>
</body>
</html>
